name: Deploy API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CLOUDFLARE_ACCOUNT_ID: 43c18a1cb7ff7a55f2e0859a3b65aa48

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: node -e "require('./middleware/auth'); require('./middleware/rateLimit'); require('./middleware/validate'); require('./middleware/cors'); console.log('All modules loaded successfully')"

  deploy-firestore:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install -g firebase-tools
      - run: firebase deploy --only firestore:rules,firestore:indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        app:
          - name: crown-bingo
            dir: crownbingo
          - name: crown-bingo-super-agent
            dir: superagentcrownbingo
          - name: crown-bingo-admin
            dir: admin-panel
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci --legacy-peer-deps
        working-directory: ${{ matrix.app.dir }}
      - run: npm run build
        working-directory: ${{ matrix.app.dir }}
      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy build \
            --project-name ${{ matrix.app.name }} \
            --branch main
        working-directory: ${{ matrix.app.dir }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-render:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK"
          fi
